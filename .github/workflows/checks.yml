name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PIPENV_VENV_IN_PROJECT: "1"
      PIPENV_IGNORE_VIRTUALENVS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Pipenv
        run: pipx install pipenv==2026.8.0
      - name: Install locked project and development tools
        run: pipenv sync --dev
      - name: Lint and test
        run: |
          pipenv run lint
          pipenv run test
      - name: Check exported schema
        run: |
          pipenv run schema
          git diff --exit-code -- openapi.json revisions/rev-c/software/
      - name: Check distributable package
        run: |
          pipenv run package
          pipenv run python scripts/check_wheel.py
      - name: Exercise live simulator API
        run: pipenv run smoke
      - name: Exercise Rev C live HTTP and crash recovery
        run: pipenv run python scripts/http_smoke_revc.py
  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visualization
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install locked viewer dependencies
        run: npm ci
      - name: Validate and reproduce offline viewer
        run: |
          npm run check
          npm run build
          git diff --exit-code -- index.html
      - name: Reproduce Rev C viewer
        run: |
          node ../revisions/rev-c/visualization/build.mjs
          git diff --exit-code -- ../revisions/rev-c/visualization/index.html
